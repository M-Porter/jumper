version: 2

builds:
  - id: jumper-linux
    binary: jumper
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: jumper-darwin
    binary: jumper
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    hooks:
      post:
        - cmd: quill sign-and-notarize "{{ .Path }}" --dry-run={{ .IsSnapshot }} --ad-hoc={{ .IsSnapshot }} -vv
          env:
            - QUILL_LOG_FILE=/tmp/quill-{{ .Target }}.log

homebrew_casks:
  - name: jumper
    binaries:
      - jumper
    repository:
      owner: M-Porter
      name: homebrew-tap
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    commit_author:
      name: Matt Porter
      email: mtp5129@gmail.com
    commit_msg_template: "Cask update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/M-Porter/jumper"
    description: "Quickly jump to your project directories"
    caveats: |
      See the README for setup instructions: https://github.com/M-Porter/jumper#readme

version: 2

builds:
  - goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

homebrew_casks:
  - name: jumper
    binaries:
      - jumper
    repository:
      owner: M-Porter
      name: homebrew-tap
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    commit_author:
      name: Matt Porter
      email: mtp5129@gmail.com
    commit_msg_template: "Cask update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/M-Porter/jumper"
    description: "Quickly jump to your project directories"
    caveats: |
      See the README for setup instructions: https://github.com/M-Porter/jumper#readme
